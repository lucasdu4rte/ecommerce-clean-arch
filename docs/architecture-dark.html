<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Architecture in a Next.js store</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #0a0a0a;
      --color-ink: #fafafa;
      --color-muted: #a1a1aa;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>Clean Architecture in a Next.js store</h1>
    <svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">Clean Architecture in a Next.js store</title>
      <desc id="architecture-dark-desc">Architecture diagram showing the UI and use cases depending inward on domain entities and ports, while the HTTP and storage adapters that sit outside the core implement those ports and call the Next.js route handlers.</desc>

      </defs>

      <rect width="100%" height="100%" fill="#0a0a0a"/>

      <rect x="384" y="84" width="112" height="12" rx="2" fill="#0a0a0a"/>
      <text x="440" y="93" fill="rgba(250,250,250,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">@CORE · NO FRAMEWORK</text>

      <!-- Arrows first, so z-order puts them behind the nodes -->
      <line x1="184" y1="144" x2="248" y2="144" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
      <line x1="408" y1="144" x2="472" y2="144" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
      <path d="M 328,176 V 216 Q 328,224 336,224 H 544 Q 552,224 552,232 V 280" fill="none" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
      <path d="M 728,312 H 632" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-dark-arrow-accent)"/>
      <line x1="808" y1="280" x2="808" y2="176" stroke="#6f9fe8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>

        <rect x="196" y="124" width="32" height="12" rx="2" fill="#0a0a0a"/>

        <rect x="424" y="124" width="32" height="12" rx="2" fill="#0a0a0a"/>
        <text x="440" y="133" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USES</text>

        <rect x="408" y="204" width="64" height="12" rx="2" fill="#0a0a0a"/>
        <text x="440" y="213" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPENDS ON</text>

        <rect x="648" y="292" width="64" height="12" rx="2" fill="#0a0a0a"/>

        <rect x="768" y="220" width="32" height="12" rx="2" fill="#0a0a0a"/>
        <text x="784" y="229" fill="#6f9fe8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>

        <rect x="40" y="112" width="144" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="40" y="112" width="144" height="64" rx="6" fill="rgba(161,161,170,0.10)" stroke="#71717a" stroke-width="1"/>
        <rect x="48" y="120" width="28" height="12" rx="2" fill="transparent" stroke="#71717a" stroke-width="0.8"/>
        <text x="62" y="129" fill="#71717a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>

        <rect x="248" y="112" width="160" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="248" y="112" width="160" height="64" rx="6" fill="#141417" stroke="#fafafa" stroke-width="1"/>
        <rect x="256" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(250,250,250,0.40)" stroke-width="0.8"/>
        <text x="270" y="129" fill="#fafafa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC</text>
        <text x="328" y="148" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Use Cases</text>
        <text x="328" y="164" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">application/</text>

        <rect x="472" y="112" width="160" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="472" y="112" width="160" height="64" rx="6" fill="#141417" stroke="#fafafa" stroke-width="1"/>

        <rect x="472" y="280" width="160" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="472" y="280" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="480" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="496" y="297" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
        <text x="552" y="316" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ports</text>
        <text x="552" y="332" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Product · Cart · Order</text>

        <rect x="728" y="112" width="160" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="728" y="112" width="160" height="64" rx="6" fill="rgba(250,250,250,0.03)" stroke="rgba(250,250,250,0.30)" stroke-width="1"/>
        <rect x="736" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(250,250,250,0.30)" stroke-width="0.8"/>
        <text x="750" y="129" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="808" y="148" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route Handlers</text>
        <text x="808" y="164" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api · db.json</text>

        <rect x="728" y="280" width="160" height="64" rx="6" fill="#0a0a0a"/>
        <rect x="728" y="280" width="160" height="64" rx="6" fill="#141417" stroke="#fafafa" stroke-width="1"/>
        <rect x="736" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(250,250,250,0.40)" stroke-width="0.8"/>
        <text x="752" y="297" fill="#fafafa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INFRA</text>
        <text x="808" y="316" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adapters</text>
        <text x="808" y="332" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">axios · localStorage</text>

      <!-- Legend: horizontal strip, outside the diagram area -->
      <line x1="40" y1="432" x2="920" y2="432" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="40" y="448" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="460" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Port (the seam)</text>

        <rect x="168" y="460" width="14" height="10" rx="2" fill="#141417" stroke="#fafafa" stroke-width="1"/>
        <text x="188" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Module</text>

        <rect x="296" y="460" width="14" height="10" rx="2" fill="rgba(161,161,170,0.10)" stroke="#71717a" stroke-width="1"/>
        <text x="316" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">UI</text>

        <rect x="424" y="460" width="14" height="10" rx="2" fill="rgba(250,250,250,0.03)" stroke="rgba(250,250,250,0.30)" stroke-width="1"/>
        <text x="444" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Outside @core</text>

        <line x1="552" y1="466" x2="580" y2="466" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <text x="588" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Depends on</text>

        <line x1="680" y1="466" x2="708" y2="466" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-dark-arrow-accent)"/>
        <text x="716" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Implements</text>

        <line x1="808" y1="466" x2="836" y2="466" stroke="#6f9fe8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
        <text x="844" y="468" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>

  </div>
</body>
</html>
